<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Стабильность Банк — Админ 3.0</title><link rel="stylesheet" href="css/style.css"></head><body class="app-shell"><main class="main-area" style="margin-left:0"><header class="topbar"><div class="page-heading"><span class="eyebrow">STABILITY BANK 3.0</span><h1>Рабочее место администратора</h1></div><button class="icon-btn" id="reload">↻</button></header><div id="app" style="display:grid;grid-template-columns:250px minmax(420px,1fr) 300px;gap:14px;padding:18px"></div></main><script type="module">import{getCurrentUser,signOut}from'./js/auth.js';import*as api from'./js/admin.js';const u=await getCurrentUser();if(!u||u.role!=='admin'){location.href='index.html';throw Error('Нет доступа')}const app=document.getElementById('app'),money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let players=await api.getAllPlayers(),selected=null;const css=`<style>.box{background:#0b192b;border:1px solid #1d344e;border-radius:15px;padding:15px}.search,input,select,textarea{box-sizing:border-box;width:100%;padding:11px;background:#091727;border:1px solid #203752;border-radius:9px;color:#fff}.list{max-height:650px;overflow:auto}.p{display:flex;gap:8px;width:100%;padding:10px;margin:5px 0;background:#091727;border:1px solid #1b3049;border-radius:10px;color:#fff;text-align:left}.p.active{border-color:#3d7cff;background:#10243d}.p div:nth-child(2){flex:1}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.tab,button{cursor:pointer}.tab{padding:10px;background:#091727;border:1px solid #1d344f;border-radius:9px;color:#9ab}.tab.active{background:#19385f;color:#fff;border-color:#3d7cff}.op{display:none}.op.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.btn{padding:11px;border:0;border-radius:9px;font-weight:800}.blue{background:#316fe0;color:#fff}.green{background:#1b7853;color:#fff}.red{background:#8d3341;color:#fff}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #172b44;font-size:11px}.balance{font-size:28px;font-weight:900;padding:18px;background:#091827;border:1px solid #1d3855;border-radius:12px}.history{max-height:500px;overflow:auto}.hr{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #172b44;font-size:10px}.muted{color:#7188a3;font-size:9px}.preview{padding:15px;background:#0a1b2d;border:1px solid #21466a;border-radius:11px;margin-top:10px}.preview b{display:block;font-size:24px;margin-top:3px}@media(max-width:900px){#app{grid-template-columns:1fr!important}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.tabs{grid-template-columns:repeat(2,1fr)}}</style>`;function render(){app.innerHTML=css+`<section class="box"><h3>Игроки <small class="muted">${players.length}</small></h3><input id="q" placeholder="Поиск игрока"><div class="list" id="list"></div></section><section class="box"><div><span class="muted">РАБОЧАЯ ОБЛАСТЬ</span><h3 id="name">Выберите игрока</h3></div><div class="tabs">${['money:Баланс','salary:Зарплата','fine:Штраф','credit:Кредит','profile:Профиль','notify:Уведомление','history:История'].map(x=>{let[a,b]=x.split(':');return `<button class="tab ${a==='money'?'active':''}" data-t="${a}">${b}</button>`}).join('')}</div><div id="work"></div></section><aside class="box" id="right"><div class="muted">ВЫБРАННЫЙ ИГРОК</div><p>Выберите игрока слева.</p></aside>`;drawList();drawWork('money');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawWork(b.dataset.t)});document.getElementById('q').oninput=drawList}function drawList(){const q=(document.getElementById('q')?.value||'').toLowerCase();document.getElementById('list').innerHTML=players.filter(p=>(p.role||'player')==='player'&&(`${p.full_name||''} ${p.username||''}`).toLowerCase().includes(q)).map(p=>`<button class="p ${selected?.id===p.id?'active':''}" data-id="${p.id}"><b>${esc((p.full_name||p.username||'?')[0])}</b><div><strong>${esc(p.full_name||p.username||'Без имени')}</strong><small class="muted">@${esc(p.username||'—')}</small></div><strong>${money(p.balance)}</strong></button>`).join('')||'<p class="muted">Игроки не найдены</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=players.find(p=>p.id===b.dataset.id);render()})}function drawRight(){document.getElementById('right').innerHTML=selected?`<div class="muted">ВЫБРАННЫЙ ИГРОК</div><h3>${esc(selected.full_name||selected.username)}</h3><div class="balance">${money(selected.balance)}</div><div class="row"><span>Дата рождения</span><b>${esc(selected.birth_date||'—')}</b></div><div class="row"><span>Паспорт</span><b>${esc(selected.passport_number||'—')}</b></div><div class="row"><span>Статус</span><b>${esc(selected.status||'active')}</b></div>`:'<p class="muted">Выберите игрока слева.</p>'}async function act(fn){try{await fn();players=await api.getAllPlayers();selected=players.find(p=>p.id===selected?.id)||null;render();alert('Готово')}catch(e){alert(e.message)}}function drawWork(t){drawRight();if(!selected){document.getElementById('work').innerHTML='<p class="muted">Сначала выберите игрока слева.</p>';return}if(t==='money')document.getElementById('work').innerHTML='<div class="grid"><label>Сумма<input id="amt" type="number" min="1"></label><label>Описание<input id="desc" placeholder="Операция банка"></label><button class="btn green" id="dep">Пополнить</button><button class="btn red" id="wit">Снять</button></div>';if(t==='salary'){const groups=[...new Set(Object.values(api.SALARY_JOBS).map(x=>x[0]))];document.getElementById('work').innerHTML=`<label>Направление<select id="jg">${groups.map(g=>`<option>${g}</option>`).join('')}</select></label><label>Работа<select id="job"></select></label><div id="jf"></div><div class="preview"><span class="muted">К выплате</span><b id="sum">0 ₽</b></div><button class="btn blue" id="pay" style="width:100%;margin-top:10px">ВЫДАТЬ ЗАРПЛАТУ</button>`;const jobs=()=>{const g=document.getElementById('jg').value;document.getElementById('job').innerHTML=Object.entries(api.SALARY_JOBS).filter(([,v])=>v[0]===g).map(([k,v])=>`<option value="${k}">${v[1]}</option>`).join('');fields()};const fields=()=>{const j=api.SALARY_JOBS[document.getElementById('job').value],f=document.getElementById('jf');f.innerHTML=j[2]==='orders'?'<label>Заказы<input id="orders" type="number" min="0" max="'+j[4]+'" value="1"></label>':j[2]==='taxi'?'<div class="grid"><label>Поездки<input id="orders" type="number" min="0" max="7" value="1"></label><label>Класс<select id="vc"><option value="low">Эконом</option><option value="medium">Средний</option><option value="high">Высокий</option><option value="business">Бизнес</option></select></label></div>':j[2]==='contract'?'<label>Контракт<input id="contract" type="number" min="0"></label>':j[2]==='bus'||j[2]==='delivery'?'<label>Тюнинг<select id="tun"><option value="none">Нет</option><option value="vip_interior">VIP</option><option value="soundproof">Шумоизоляция</option><option value="climate_monitors">Климат</option><option value="trunk">Багажник</option><option value="air_suspension">Пневма</option></select></label>':'';f.querySelectorAll('input,select').forEach(x=>x.oninput=calc);calc()};const calc=()=>{const k=document.getElementById('job').value,p={orders:Number(document.getElementById('orders')?.value||0),contract_amount:Number(document.getElementById('contract')?.value||0),vehicle_class:document.getElementById('vc')?.value||'low',tuning:document.getElementById('tun')?.value||'none'};document.getElementById('sum').textContent=money(api.calculateSalary(k,p));document.getElementById('pay').onclick=()=>act(()=>api.paySalary(selected.id,k,p))};document.getElementById('jg').onchange=jobs;document.getElementById('job').onchange=fields;jobs()}if(t==='fine')document.getElementById('work').innerHTML='<div class="grid"><label>Сумма<input id="fa" type="number" min="1"></label><label>Причина<input id="fr"></label><button class="btn red wide" id="fb">Выдать штраф</button></div>';if(t==='credit')document.getElementById('work').innerHTML='<div class="grid"><label>Сумма<input id="ca" type="number" min="1"></label><label>Процент<input id="cr" type="number" value="0"></label><button class="btn blue wide" id="cb">Оформить кредит</button></div>';if(t==='profile')document.getElementById('work').innerHTML=`<div class="grid"><label>ФИО<input id="pf" value="${esc(selected.full_name||'')}"></label><label>Username<input id="pu" value="${esc(selected.username||'')}"></label><label>Дата рождения<input id="bd" type="date" value="${esc(selected.birth_date||'')}"></label><label>Паспорт<input id="pp" value="${esc(selected.passport_number||'')}"></label><button class="btn blue wide" id="pb">Сохранить профиль</button></div>`;if(t==='notify')document.getElementById('work').innerHTML='<label>Заголовок<input id="nt"></label><label>Сообщение<textarea id="nm" style="width:100%;min-height:100px;background:#091727;color:#fff;border:1px solid #203752;border-radius:9px;margin-top:7px"></textarea></label><button class="btn blue" id="nb" style="width:100%;margin-top:10px">Отправить</button>';if(t==='history')loadHistory();if(t==='money'){dep.onclick=()=>act(()=>api.depositFunds(selected.id,amt.value,desc.value||'Пополнение'));wit.onclick=()=>act(()=>api.withdrawFunds(selected.id,amt.value,desc.value||'Снятие'))}if(t==='fine')fb.onclick=()=>act(()=>api.issueFine(selected.id,fa.value,fr.value));if(t==='credit')cb.onclick=()=>act(()=>api.issueCredit(selected.id,ca.value,cr.value));if(t==='profile')pb.onclick=()=>act(()=>api.updatePlayerProfile(selected.id,{full_name:pf.value,username:pu.value,birth_date:bd.value,passport_number:pp.value}));if(t==='notify')nb.onclick=()=>act(()=>api.sendNotification(selected.id,nt.value||'Сообщение банка',nm.value,'info'))}async function loadHistory(){const rows=await api.getTransactions(selected.id);document.getElementById('work').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h3>История игрока</h3><button class="btn red" id="clear">Удалить всю</button></div><div class="history">${rows.map(r=>`<div class="hr"><div><b>${esc(r.description||r.type||'Операция')}</b><small class="muted">${r.created_at?new Date(r.created_at).toLocaleString('ru-RU'):''}</small></div><div><b class="plus">${money(r.amount)}</b><br><button class="danger-link" data-del="${r.id}">Удалить</button></div></div>`).join('')||'<p class="muted">История пуста</p>'}</div>`;document.getElementById('clear').onclick=()=>confirm('Удалить всю историю игрока?')&&act(()=>api.clearPlayerHistory(selected.id));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirm('Удалить запись?')&&act(()=>api.deleteTransaction(b.dataset.del)))}drawWork=drawWork;render();</script></body></html>
