<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Вход — Стабильность Банк</title><link rel="stylesheet" href="css/style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body.login-page{background:#0b1220;min-height:100vh;display:grid;place-items:center;padding:20px}.login-page .app-bg{opacity:.7}.login-card{position:relative;z-index:2;width:min(430px,100%);padding:34px;background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.login-mark{width:46px;height:46px;border-radius:14px;background:#0b1220;color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800}.login-brand strong,.login-brand span{display:block}.login-brand strong{font-size:18px}.login-brand span{font-size:11px;color:#8791a2;margin-top:2px}.login-title{font-size:23px;margin:0 0 5px}.login-subtitle{margin:0 0 24px;color:#8791a2;font-size:12px}.login-form{display:grid;gap:15px}.login-label{font-size:10px;font-weight:800;color:#677287;text-transform:uppercase;letter-spacing:.06em}.login-input{width:100%;margin-top:7px;padding:13px 14px;border:1px solid #dfe4ec;background:#fbfcfe;border-radius:11px;outline:none}.login-input:focus{border-color:#8190ac;box-shadow:0 0 0 3px rgba(71,101,164,.08)}.login-submit{width:100%;padding:13px;border-radius:11px;background:#0b1220;color:#fff;font-weight:800}.login-footer{margin-top:22px;text-align:center;color:#9aa3b2;font-size:10px}</style></head>
<body class="login-page"><div class="app-bg"></div><div class="login-card"><div class="login-brand"><div class="login-mark">₽</div><div><strong>Стабильность Банк</strong><span>Единая банковская система</span></div></div><h1 class="login-title">Вход в систему</h1><p class="login-subtitle">Авторизуйтесь для доступа к личному кабинету.</p><div id="alertsContainer"></div><form id="loginForm" class="login-form"><label class="login-label">Email<input class="login-input" type="email" id="email" autocomplete="username" placeholder="Введите email" required></label><label class="login-label">Пароль<input class="login-input" type="password" id="password" autocomplete="current-password" placeholder="Введите пароль" required></label><button class="login-submit" type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Войти</button></form><div class="login-footer">Система «Стабильность Банк»</div></div>
<script type="module">import{signIn,getCurrentUser}from'./js/auth.js';import{showAlert}from'./js/utils.js';document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return showAlert('Заполните все поля','error');try{await signIn(email,password);const user=await getCurrentUser();if(user?.role==='admin')location.href='admin.html';else if(user?.role==='player')location.href='player.html';else showAlert('Неизвестная роль пользователя','error')}catch(err){showAlert('Ошибка входа: '+err.message,'error')}});</script></body></html>
