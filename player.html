<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Стабильность Банк — Личный кабинет</title><link rel="stylesheet" href="css/style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
.player3{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;gap:14px}.center{min-width:0}.transfer-list{display:grid;gap:7px;max-height:420px;overflow:auto}.recipient{display:flex;align-items:center;gap:10px;width:100%;padding:10px;background:#0b192b;border:1px solid #1a2e47;border-radius:11px;color:#eef5ff;text-align:left}.recipient:hover,.recipient.sel{border-color:#3d7cff;background:#10243d}.recipient .rinfo{min-width:0;flex:1}.recipient strong,.recipient small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recipient strong{font-size:11px}.recipient small{font-size:9px;color:#7188a3;margin-top:2px}.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#8195ad;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #203752;background:#091727;border-radius:10px;color:#eef5ff;outline:none}.account-big{padding:20px;border-radius:15px;background:#091827;border:1px solid #1d354f}.account-big span{font-size:10px;color:#7188a3}.account-big strong{display:block;font-size:31px;margin-top:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #172b44;font-size:11px}.row:last-child{border-bottom:0}.row span{color:#7188a3}.right-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.notice2{padding:12px;border:1px solid #1d344f;border-radius:12px;background:#0b192b;font-size:10px;color:#8ea3ba;line-height:1.6}.notification{padding:12px;border:1px solid #1a304a;border-radius:12px;background:#0b192b;margin-bottom:7px}.notification.unread{border-color:#365d8b;background:#10243d}.notification strong,.notification span{display:block}.notification strong{font-size:11px}.notification span{font-size:9px;color:#7188a3;margin-top:4px}.notification b{display:inline-block;margin-top:8px;font-size:9px;color:#5f91ff}.status-badge{white-space:nowrap}.history-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid #172b44}.history-row:last-child{border:0}.history-row strong,.history-row small{display:block}.history-row strong{font-size:11px}.history-row small{font-size:9px;color:#7188a3;margin-top:3px}.positive{color:#49d895}.negative{color:#ff6d7b}.section-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.section-tabs button{padding:8px 10px;border-radius:9px;background:#0d1d31;border:1px solid #1d344f;color:#8fa2ba;font-size:10px;font-weight:800}.section-tabs button.active{background:#19385f;color:#fff;border-color:#3d7cff}.toast{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:11px;background:#10243c;border:1px solid #284b73}.toast.ok{background:rgba(34,199,122,.08);border-color:rgba(34,199,122,.2);color:#55d99b}.toast.err{background:rgba(255,82,100,.08);border-color:rgba(255,82,100,.2);color:#ff7381}@media(max-width:1200px){.player3{grid-template-columns:190px minmax(0,1fr)}.right3{grid-column:1/-1}}@media(max-width:800px){.player3{grid-template-columns:1fr}.two,.form2{grid-template-columns:1fr}.field.full{grid-column:auto}.main-area{margin-left:0}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.content-section{padding:18px}}
</style></head><body class="app-shell"><div class="app-bg"></div><aside class="sidebar"><div class="brand"><div class="brand-mark">₽</div><div><strong>Стабильность</strong><span>Банк</span></div></div><nav class="nav-list"><button class="nav-item active" data-view="dashboard"><i class="fa-solid fa-house"></i>Главная</button><button class="nav-item" data-view="profile"><i class="fa-solid fa-user"></i>Профиль</button><button class="nav-item" data-view="account"><i class="fa-solid fa-wallet"></i>Счёт</button><button class="nav-item" data-view="transfer"><i class="fa-solid fa-money-bill-transfer"></i>Переводы</button><button class="nav-item" data-view="salary"><i class="fa-solid fa-money-check-dollar"></i>Зарплаты</button><button class="nav-item" data-view="fines"><i class="fa-solid fa-gavel"></i>Штрафы</button><button class="nav-item" data-view="credits"><i class="fa-solid fa-landmark"></i>Кредиты</button><button class="nav-item" data-view="history"><i class="fa-solid fa-clock-rotate-left"></i>История</button><button class="nav-item" data-view="notifications"><i class="fa-solid fa-bell"></i>Уведомления</button><button class="nav-item" data-view="settings"><i class="fa-solid fa-gear"></i>Настройки</button></nav><div class="sidebar-bottom"><div class="admin-mini"><div class="avatar" id="miniAvatar">P</div><div><strong id="miniName">Игрок</strong><small>Личный кабинет</small></div></div><button class="nav-item" id="logout"><i class="fa-solid fa-right-from-bracket"></i>Выйти</button></div></aside><main class="main-area"><header class="topbar"><div class="page-heading"><span class="eyebrow">STABILITY BANK 3.0</span><h1 id="title">Главная</h1></div><div class="top-actions"><div class="live-pill"><span></span> Синхронизация</div><button class="icon-btn" id="refresh"><i class="fa-solid fa-rotate"></i></button></div></header><div id="alert"></div><section class="content-section active"><div class="player3"><aside class="panel"><div class="panel-head"><h3>Навигация</h3></div><div class="notice2">Все разделы работают в одном окне. Центр — текущая работа, справа — состояние вашего счёта.</div><div style="margin-top:12px" id="quickRecipient"></div></aside><div class="center"><div class="section-tabs" id="tabs"><button class="active" data-tab="dashboard">Главная</button><button data-tab="account">Счёт</button><button data-tab="transfer">Перевод</button><button data-tab="salary">Зарплаты</button><button data-tab="fines">Штрафы</button><button data-tab="credits">Кредиты</button><button data-tab="history">История</button><button data-tab="notifications">Уведомления</button></div><div id="centerContent"></div></div><aside class="panel right3" id="right"></aside></div></section></main>
<script type="module">
import { getCurrentUser,signOut } from './js/auth.js';import { supabase } from './js/supabase-client.js';import * as api from './js/final-player.js';
const user=await getCurrentUser();if(!user||user.role!=='player'){location.href='index.html';throw new Error('Нет доступа')}
let profile=null,recipients=[],selectedRecipient=null,current='dashboard',data={fines:[],credits:[],tx:[],salary:[],notifications:[]};
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function alertx(text,ok=true){$('alert').innerHTML=`<div class="toast ${ok?'ok':'err'}">${esc(text)}</div>`;setTimeout(()=>{$('alert').innerHTML=''},3500)}
function txrow(t){const out=t.from_user===user.id;return `<div class="history-row"><div><strong>${esc(t.description||t.type||'Операция')}</strong><small>${t.created_at?new Date(t.created_at).toLocaleString('ru-RU'):''} · ${esc(t.type||'—')}</small></div><b class="${out?'negative':'positive'}">${out?'-':'+'}${money(Math.abs(t.amount))}</b></div>`}
function renderRight(){const fine=data.fines.reduce((s,x)=>s+Number(x.amount||0),0),credit=data.credits.reduce((s,x)=>s+Number(x.remaining??x.amount??0),0);$('right').innerHTML=`<div class="side-card"><div class="context-head"><div class="avatar xl" id="miniAvatar2">${esc((profile.full_name||profile.username||'P')[0])}</div><div><h3>${esc(profile.full_name||profile.username||'Игрок')}</h3><p>@${esc(profile.username||'—')}</p></div><span class="status-badge success">Активен</span></div><div class="account-big"><span>Текущий баланс</span><strong>${money(profile.balance)}</strong></div><div class="row"><span>Штрафы</span><b>${money(fine)}</b></div><div class="row"><span>Долг по кредитам</span><b>${money(credit)}</b></div><div class="row"><span>Операций</span><b>${data.tx.length}</b></div><div class="right-actions"><button class="primary-btn" id="quickTransfer">Перевести</button><button class="secondary-btn" id="quickHistory">История</button></div></div>`;$('quickTransfer').onclick=()=>setTab('transfer');$('quickHistory').onclick=()=>setTab('history')}
function setTab(t){current=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderCenter()}
function renderCenter(){const c=$('centerContent');if(current==='dashboard'){c.innerHTML=`<div class="welcome-row"><div><span class="eyebrow">Личный кабинет</span><h2>Здравствуйте, ${esc(profile.full_name||profile.username||'игрок')} 👋</h2><p>Ваши деньги, штрафы, кредиты, зарплаты и переводы — в одном окне.</p></div></div><div class="stat-grid"><article class="stat-card"><div class="stat-icon green"><i class="fa-solid fa-wallet"></i></div><div><span>Баланс</span><strong>${money(profile.balance)}</strong></div></article><article class="stat-card"><div class="stat-icon red"><i class="fa-solid fa-gavel"></i></div><div><span>Штрафы</span><strong>${money(data.fines.reduce((s,x)=>s+Number(x.amount||0),0))}</strong></div></article><article class="stat-card"><div class="stat-icon amber"><i class="fa-solid fa-landmark"></i></div><div><span>Кредиты</span><strong>${money(data.credits.reduce((s,x)=>s+Number(x.remaining??x.amount??0),0))}</strong></div></article></div><div class="two"><div class="panel"><div class="panel-head"><h3>Последние операции</h3></div>${data.tx.slice(0,8).map(txrow).join('')||'<div class="empty-state">История пуста</div>'}</div><div class="panel"><div class="panel-head"><h3>Последняя зарплата</h3></div>${data.salary.slice(0,5).map(s=>`<div class="history-row"><div><strong>${esc(s.job_title||s.job_key||'Зарплата')}</strong><small>${s.created_at?new Date(s.created_at).toLocaleString('ru-RU'):''}</small></div><b class="positive">+${money(s.amount)}</b></div>`).join('')||'<div class="empty-state">Выплат ещё нет</div>'}</div></div>`;return}if(current==='account'){c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Банковский счёт</span><h2>Мой счёт</h2></div></div><div class="account-big"><span>Доступный баланс</span><strong>${money(profile.balance)}</strong></div><div class="panel" style="margin-top:14px"><div class="row"><span>ФИО</span><b>${esc(profile.full_name||'—')}</b></div><div class="row"><span>Username</span><b>@${esc(profile.username||'—')}</b></div><div class="row"><span>Регистрация</span><b>${profile.created_at?new Date(profile.created_at).toLocaleDateString('ru-RU'):'—'}</b></div><div class="row"><span>Активные штрафы</span><b>${data.fines.length}</b></div><div class="row"><span>Активные кредиты</span><b>${data.credits.length}</b></div></div>`;return}if(current==='profile'){c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Личные данные</span><h2>Профиль</h2></div></div><div class="panel"><div class="row"><span>ФИО</span><b>${esc(profile.full_name||'—')}</b></div><div class="row"><span>Дата рождения</span><b>${esc(profile.birth_date||'—')}</b></div><div class="row"><span>Номер паспорта</span><b>${esc(profile.passport_number||'—')}</b></div><div class="row"><span>Username</span><b>@${esc(profile.username||'—')}</b></div><div class="notice2" style="margin-top:12px">Работа здесь намеренно не показывается. Она хранится в другой системе.</div></div>`;return}if(current==='transfer'){renderTransfer();return}if(current==='salary'){c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Доходы</span><h2>Мои зарплаты</h2></div></div><div class="panel">${data.salary.map(s=>`<div class="history-row"><div><strong>${esc(s.job_title||s.job_key||'Зарплата')}</strong><small>${s.created_at?new Date(s.created_at).toLocaleString('ru-RU'):''} · единиц: ${esc(s.units||1)}</small></div><b class="positive">+${money(s.amount)}</b></div>`).join('')||'<div class="empty-state">Зарплат ещё нет</div>'}</div>`;return}if(current==='fines'){c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Задолженности</span><h2>Мои штрафы</h2></div></div><div class="panel">${data.fines.map(f=>`<div class="history-row"><div><strong>${money(f.amount)} · ${esc(f.title||'Штраф')}</strong><small>${esc(f.reason||'Без причины')} · ${f.created_at?new Date(f.created_at).toLocaleDateString('ru-RU'):''}</small></div><button class="table-btn" data-fine="${f.id}">Оплатить</button></div>`).join('')||'<div class="empty-state">Активных штрафов нет</div>'}</div>`;document.querySelectorAll('[data-fine]').forEach(b=>b.onclick=async()=>{try{await api.payFine(Number(b.dataset.fine));alertx('Штраф оплачен');await load()}catch(e){alertx(e.message,false)}});return}if(current==='credits'){c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Финансирование</span><h2>Мои кредиты</h2></div></div><div class="panel">${data.credits.map(x=>`<div class="panel" style="margin-bottom:8px"><div class="row"><span>Кредит #${esc(x.id)}</span><b>${money(x.remaining??x.amount)}</b></div><div class="row"><span>Сумма</span><b>${money(x.amount)}</b></div><div class="row"><span>Процент</span><b>${esc(x.interest_rate??0)}%</b></div><div style="display:flex;gap:7px;margin-top:10px"><input id="repay-${x.id}" type="number" min="1" placeholder="Сумма погашения" style="flex:1;padding:9px;background:#091727;color:#fff;border:1px solid #223b58;border-radius:9px"><button class="primary-btn" data-credit="${x.id}">Погасить</button></div></div>`).join('')||'<div class="empty-state">Активных кредитов нет</div>'}</div>`;document.querySelectorAll('[data-credit]').forEach(b=>b.onclick=async()=>{const n=Number($('repay-'+b.dataset.credit).value);if(!n)return alertx('Введите сумму',false);try{await api.repayCredit(Number(b.dataset.credit),n);alertx('Платёж принят');await load()}catch(e){alertx(e.message,false)}});return}if(current==='history'){c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Журнал</span><h2>История операций</h2></div></div><div class="panel">${data.tx.map(txrow).join('')||'<div class="empty-state">История пуста</div>'}</div>`;return}if(current==='notifications'){c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Центр сообщений</span><h2>Уведомления</h2></div></div><div class="panel">${data.notifications.map(n=>`<div class="notification ${n.is_read?'':'unread'}"><strong>${esc(n.title)}</strong><span>${esc(n.message)}</span><b>${n.created_at?new Date(n.created_at).toLocaleString('ru-RU'):''}</b>${n.is_read?'':'<button class="table-btn" data-read="'+n.id+'" style="float:right">Прочитано</button>'}</div>`).join('')||'<div class="empty-state">Уведомлений нет</div>'}</div>`;document.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{await api.markNotification(Number(b.dataset.read));await load()});return}if(current==='settings'){c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Настройки</span><h2>Настройки</h2></div></div><div class="panel"><div class="row"><span>Синхронизация</span><b>Realtime включён</b></div><div class="row"><span>Безопасность</span><b>Серверные операции</b></div><div class="notice2">Изменение ФИО, паспорта, баланса и других банковских данных самостоятельно недоступно. Это делает администрация.</div></div>`}}
function renderTransfer(){const c=$('centerContent');c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Перевод</span><h2>Перевести игроку</h2><p class="muted">Получатель выбирается из списка доступных игроков.</p></div></div><div class="two"><div class="panel"><div class="search-box" style="margin-bottom:10px"><i class="fa-solid fa-magnifying-glass"></i><input id="recipientSearch" placeholder="Поиск игрока…"></div><div class="transfer-list" id="recipientList"></div></div><div class="panel"><div class="notice2" id="recipientInfo">Выберите получателя слева.</div><div class="field" style="margin-top:14px"><label>Сумма</label><input id="transferAmount" type="number" min="1" placeholder="Введите сумму"></div><button class="primary-btn wide" id="transferBtn">Перевести</button></div></div>`;function list(){const q=($('recipientSearch').value||'').toLowerCase();$('recipientList').innerHTML=recipients.filter(p=>(p.full_name||'').toLowerCase().includes(q)||(p.username||'').toLowerCase().includes(q)).map(p=>`<button class="recipient ${selectedRecipient?.id===p.id?'sel':''}" data-rec="${p.id}"><div class="avatar" style="width:31px;height:31px;border-radius:9px">${esc((p.full_name||p.username||'?')[0])}</div><div class="rinfo"><strong>${esc(p.full_name||p.username)}</strong><small>@${esc(p.username||'—')}</small></div></button>`).join('')||'<div class="empty-state">Доступных игроков нет</div>';document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{selectedRecipient=recipients.find(x=>x.id===b.dataset.rec);list();$('recipientInfo').innerHTML=`<strong>${esc(selectedRecipient.full_name||selectedRecipient.username)}</strong><br>@${esc(selectedRecipient.username)}<br><small>Игрок выбран как получатель.</small>`})}list();$('recipientSearch').oninput=list;$('transferBtn').onclick=async()=>{if(!selectedRecipient)return alertx('Выберите получателя',false);const n=Number($('transferAmount').value);if(!n||n<=0)return alertx('Введите сумму',false);try{await api.transferFunds(selectedRecipient.username,n);alertx('Перевод выполнен');$('transferAmount').value='';await load()}catch(e){alertx(e.message,false)}}}
async function load(){[profile,data.fines,data.credits,data.tx,data.salary,data.notifications,recipients]=await Promise.all([api.getMyProfile(),api.getMyFines(),api.getMyCredits(),api.getMyTransactions(),api.salaryHistory(),api.notifications(),api.allPlayers()]);$('miniName').textContent=profile.full_name||profile.username||'Игрок';renderRight();renderCenter()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===b));const map={dashboard:'dashboard',profile:'profile',account:'account',transfer:'transfer',salary:'salary',fines:'fines',credits:'credits',history:'history',notifications:'notifications',settings:'settings'};setTab(map[b.dataset.view])});$('refresh').onclick=load;$('logout').onclick=async()=>{await signOut();location.href='index.html'};supabase.channel('bank-final-player').on('postgres_changes',{event:'*',schema:'public',table:'profiles',filter:`id=eq.${user.id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'transactions'},load).on('postgres_changes',{event:'*',schema:'public',table:'fines',filter:`user_id=eq.${user.id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'credits',filter:`user_id=eq.${user.id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'bank_notifications',filter:`user_id=eq.${user.id}`},load).subscribe();await load();
</script></body></html>
