<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Стабильность Банк — Администратор</title><link rel="stylesheet" href="css/style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
.workspace3{display:grid;grid-template-columns:220px minmax(0,1fr) 320px;gap:14px}.center{min-width:0}.mini-list{display:grid;gap:6px;max-height:620px;overflow:auto}.mini-player{display:flex;align-items:center;gap:9px;width:100%;padding:10px;background:#0b192b;border:1px solid #192e48;border-radius:11px;color:#eef5ff;text-align:left}.mini-player:hover,.mini-player.sel{background:#10243d;border-color:#3d7cff}.mini-player .info{min-width:0;flex:1}.mini-player strong,.mini-player small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini-player strong{font-size:11px}.mini-player small{font-size:9px;color:#7188a3;margin-top:3px}.mini-player b{font-size:10px}.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tool{padding:15px;background:#0b192b;border:1px solid #1b334e;border-radius:13px;text-align:left;color:#eef5ff;min-height:105px}.tool:hover{border-color:#3d7cff;transform:translateY(-1px)}.tool i{font-size:18px;color:#5f91ff;margin-bottom:12px}.tool strong,.tool span{display:block}.tool strong{font-size:12px}.tool span{font-size:9px;color:#7188a3;margin-top:4px;line-height:1.4}.side-card{display:grid;gap:12px}.side-balance{padding:16px;background:#091827;border:1px solid #1c344e;border-radius:14px}.side-balance span{font-size:9px;color:#7188a3}.side-balance strong{display:block;font-size:25px;margin-top:4px}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.side-actions button{font-size:10px}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:10px;color:#8095ad;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border-radius:9px;background:#091727;color:#eef5ff;border:1px solid #223b58;outline:none}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,8,16,.78);backdrop-filter:blur(8px)}.modal.open{display:flex}.modal-card{width:min(580px,100%);max-height:90vh;overflow:auto;background:#0d1d31;border:1px solid #294561;border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:18px}.modal-head h2{margin:3px 0;font-size:20px}.close{background:#142943;color:#9fb2ca;border-radius:9px;width:34px;height:34px;font-size:20px}.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form2 .full{grid-column:1/-1}.history-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #172b44}.history-row:last-child{border-bottom:0}.history-row strong,.history-row small{display:block}.history-row strong{font-size:11px}.history-row small{font-size:9px;color:#7188a3;margin-top:3px}.danger-mini{background:#3a1620!important;border-color:#733040!important;color:#ff7c8b!important}.section-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.section-tabs button{padding:8px 10px;border-radius:9px;background:#0d1d31;border:1px solid #1d344f;color:#8fa2ba;font-size:10px;font-weight:800}.section-tabs button.active{background:#19385f;color:#fff;border-color:#3d7cff}.hidden{display:none!important}.toast{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:11px;background:#10243c;border:1px solid #284b73}.toast.ok{background:rgba(34,199,122,.08);border-color:rgba(34,199,122,.2);color:#55d99b}.toast.err{background:rgba(255,82,100,.08);border-color:rgba(255,82,100,.2);color:#ff7381}@media(max-width:1200px){.workspace3{grid-template-columns:200px minmax(0,1fr)}.right3{grid-column:1/-1}.tool-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.workspace3{grid-template-columns:1fr}.tool-grid{grid-template-columns:1fr}.form2{grid-template-columns:1fr}.form2 .full{grid-column:auto}.content-section{padding:18px}.main-area{margin-left:0}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}}
</style></head><body class="app-shell"><div class="app-bg"></div><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">₽</div><div><strong>Стабильность</strong><span>Банк</span></div></div><nav class="nav-list"><button class="nav-item active" data-view="dashboard"><i class="fa-solid fa-chart-pie"></i>Обзор</button><button class="nav-item" data-view="players"><i class="fa-solid fa-users"></i>Игроки</button><button class="nav-item" data-view="operations"><i class="fa-solid fa-bolt"></i>Финансовые операции</button><button class="nav-item" data-view="salary"><i class="fa-solid fa-money-check-dollar"></i>Зарплаты</button><button class="nav-item" data-view="fines"><i class="fa-solid fa-gavel"></i>Штрафы</button><button class="nav-item" data-view="credits"><i class="fa-solid fa-landmark"></i>Кредиты</button><button class="nav-item" data-view="history"><i class="fa-solid fa-clock-rotate-left"></i>История</button><button class="nav-item" data-view="notifications"><i class="fa-solid fa-bell"></i>Уведомления</button><button class="nav-item" data-view="security"><i class="fa-solid fa-shield-halved"></i>Безопасность</button></nav><div class="sidebar-bottom"><div class="admin-mini"><div class="avatar">A</div><div><strong>Администратор</strong><small id="adminName">—</small></div></div><button class="nav-item" id="logout"><i class="fa-solid fa-right-from-bracket"></i>Выйти</button></div></aside><main class="main-area"><header class="topbar"><div class="page-heading"><span class="eyebrow">STABILITY BANK 3.0</span><h1 id="title">Обзор</h1></div><div class="top-actions"><div class="live-pill"><span></span> Синхронизация</div><button class="icon-btn" id="refresh"><i class="fa-solid fa-rotate"></i></button></div></header><div id="alert"></div><section class="content-section active" id="app"><div class="workspace3"><aside class="panel"><div class="panel-head"><h3>Игроки</h3></div><div class="search-box" style="margin-bottom:9px"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="ФИО, username…"></div><div class="mini-list" id="players"></div></aside><div class="center"><div class="section-tabs" id="tabs"><button data-tab="dashboard" class="active">Обзор</button><button data-tab="operations">Операции</button><button data-tab="salary">Зарплата</button><button data-tab="history">История</button><button data-tab="fines">Штрафы</button><button data-tab="credits">Кредиты</button></div><div id="centerContent"></div></div><aside class="panel right3" id="right"><div class="context-empty"><i class="fa-solid fa-user"></i><h3>Игрок не выбран</h3><p>Выберите игрока слева. Здесь будут его баланс, задолженности и быстрые действия.</p></div></aside></div></section></main><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow" id="mEyebrow">Операция</span><h2 id="mTitle">—</h2></div><button class="close" id="mClose">×</button></div><div id="mBody"></div></div></div>
<script type="module">
import { getCurrentUser,signOut } from './js/auth.js';import { supabase } from './js/supabase-client.js';import * as api from './js/final-admin.js';
const me=await getCurrentUser();if(!me||me.role!=='admin'){location.href='index.html';throw new Error('Нет доступа')}adminName.textContent=me.username||me.email||'admin';
let all=[],selected=null,current='dashboard',cache={fines:[],credits:[],tx:[]};
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function alertx(text,ok=true){$('alert').innerHTML=`<div class="toast ${ok?'ok':'err'}">${esc(text)}</div>`;setTimeout(()=>{$('alert').innerHTML=''},3500)}
function status(s){return s==='active'?'<span class="status-badge success">Активен</span>':s==='frozen'?'<span class="status-badge warning">Заморожен</span>':'<span class="status-badge danger">Заблокирован</span>'}
function renderPlayers(){const q=$('search').value.toLowerCase();$('players').innerHTML=all.filter(p=>(p.full_name||'').toLowerCase().includes(q)||(p.username||'').toLowerCase().includes(q)).map(p=>`<button class="mini-player ${selected?.id===p.id?'sel':''}" data-p="${p.id}"><div class="avatar" style="width:32px;height:32px;border-radius:9px">${esc((p.full_name||p.username||'?')[0])}</div><div class="info"><strong>${esc(p.full_name||p.username||'Без имени')}</strong><small>@${esc(p.username||'—')} · ${esc(p.status||'active')}</small></div><b>${money(p.balance)}</b></button>`).join('')||'<div class="empty-state">Игроки не найдены</div>';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>selectPlayer(b.dataset.p))}
async function selectPlayer(id){selected=all.find(p=>p.id===id)||null;renderPlayers();renderRight();if(selected)await renderCenter()}
async function renderRight(){if(!selected){$('right').innerHTML='<div class="context-empty"><i class="fa-solid fa-user"></i><h3>Игрок не выбран</h3><p>Выберите игрока слева.</p></div>';return}const [fs,cs,ts]=await Promise.all([api.playerFines(selected.id),api.playerCredits(selected.id),api.playerTransactions(selected.id)]);$('right').innerHTML=`<div class="side-card"><div class="context-head"><div class="avatar xl">${esc((selected.full_name||selected.username||'?')[0])}</div><div><h3>${esc(selected.full_name||selected.username||'Игрок')}</h3><p>@${esc(selected.username||'—')} · ID ${esc(selected.id.slice(0,8))}</p></div>${status(selected.status||'active')}</div><div class="side-balance"><span>Баланс</span><strong>${money(selected.balance)}</strong></div><div class="context-stats"><div><span>Штрафы</span><strong>${fs.filter(x=>!x.is_paid).length}</strong></div><div><span>Кредиты</span><strong>${cs.filter(x=>!x.is_closed).length}</strong></div><div><span>Операции</span><strong>${ts.length}</strong></div><div><span>Статус</span><strong>${esc(selected.status||'active')}</strong></div></div><div class="side-actions"><button class="primary-btn" data-act="deposit">Пополнить</button><button class="secondary-btn" data-act="withdraw">Снять</button><button class="secondary-btn" data-act="salary">Зарплата</button><button class="secondary-btn" data-act="fine">Штраф</button><button class="secondary-btn" data-act="credit">Кредит</button><button class="secondary-btn" data-act="edit">Редактировать</button><button class="secondary-btn" data-act="notify">Уведомление</button><button class="danger-btn" data-act="freeze">${selected.status==='frozen'?'Разморозить':'Заморозить'}</button><button class="danger-btn" data-act="block">${selected.status==='blocked'?'Разблокировать':'Заблокировать'}</button><button class="secondary-btn" data-act="clearhistory">Очистить историю</button></div></div>`;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act))}
function setTab(t){current=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderCenter()}
async function renderCenter(){const c=$('centerContent');if(current==='dashboard'){const [f,cr,tx]=await Promise.all([api.fines(),api.credits(),api.transactions()]);cache={fines:f,credits:cr,tx};const bal=all.reduce((s,p)=>s+Number(p.balance||0),0);c.innerHTML=`<div class="welcome-row"><div><span class="eyebrow">Единое рабочее окно</span><h2>Панель банка</h2><p>Слева — игроки, в центре — работа, справа — выбранный игрок.</p></div></div><div class="stat-grid"><article class="stat-card"><div class="stat-icon"><i class="fa-solid fa-users"></i></div><div><span>Игроков</span><strong>${all.length}</strong></div></article><article class="stat-card"><div class="stat-icon green"><i class="fa-solid fa-wallet"></i></div><div><span>Баланс игроков</span><strong>${money(bal)}</strong></div></article><article class="stat-card"><div class="stat-icon red"><i class="fa-solid fa-gavel"></i></div><div><span>Неоплаченные штрафы</span><strong>${money(f.filter(x=>!x.is_paid).reduce((s,x)=>s+Number(x.amount||0),0))}</strong></div></article><article class="stat-card"><div class="stat-icon amber"><i class="fa-solid fa-landmark"></i></div><div><span>Остаток кредитов</span><strong>${money(cr.filter(x=>!x.is_closed).reduce((s,x)=>s+Number(x.remaining??x.amount??0),0))}</strong></div></article></div><div class="panel"><div class="panel-head"><h3>Последние операции</h3><button class="text-btn" id="openHistory">Открыть всю историю</button></div>${tx.slice(0,12).map(t=>txrow(t)).join('')||'<div class="empty-state">Операций нет</div>'}</div>`;$('openHistory')?.addEventListener('click',()=>setTab('history'));return}
if(current==='operations'){c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Финансы</span><h2>Все действия</h2><p class="muted">Выберите игрока слева, затем действие.</p></div></div><div class="tool-grid"><button class="tool" data-act="deposit"><i class="fa-solid fa-circle-plus"></i><strong>Пополнение</strong><span>Начислить деньги игроку</span></button><button class="tool" data-act="withdraw"><i class="fa-solid fa-circle-minus"></i><strong>Снятие</strong><span>Списать деньги со счёта</span></button><button class="tool" data-act="salary"><i class="fa-solid fa-money-check-dollar"></i><strong>Зарплата</strong><span>Расчёт по работе, должности и параметрам</span></button><button class="tool" data-act="fine"><i class="fa-solid fa-gavel"></i><strong>Новый штраф</strong><span>Создать задолженность</span></button><button class="tool" data-act="credit"><i class="fa-solid fa-landmark"></i><strong>Новый кредит</strong><span>Выдать финансирование</span></button><button class="tool" data-act="edit"><i class="fa-solid fa-user-pen"></i><strong>Профиль</strong><span>Изменить ФИО, паспорт, username</span></button><button class="tool" data-act="notify"><i class="fa-solid fa-bell"></i><strong>Уведомление</strong><span>Отправить сообщение игроку</span></button><button class="tool" data-act="clearhistory"><i class="fa-solid fa-trash"></i><strong>Очистить историю</strong><span>Удалить всю историю выбранного игрока</span></button></div>`;bindActions();return}
if(current==='salary'){c.innerHTML=salaryView();bindSalary();return}
if(current==='history'){const tx=selected?await api.playerTransactions(selected.id):await api.transactions();c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Журнал</span><h2>${selected?'История игрока':'Вся история'}</h2><p class="muted">${selected?'Удаление отдельных записей или всей истории игрока доступно справа.':'Выберите игрока слева для его персональной истории.'}</p></div>${selected?'<button class="danger-btn" id="clearHistory">Удалить всю историю игрока</button>':''}</div><div class="panel">${tx.map(t=>txrow(t,true)).join('')||'<div class="empty-state">История пуста</div>'}</div>`;document.querySelectorAll('[data-delete-tx]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить эту запись из истории? Баланс не изменится.'))return;try{await api.deleteHistory(b.dataset.deleteTx);alertx('Запись удалена');await renderCenter();await renderRight()}catch(e){alertx(e.message,false)}});$('clearHistory')?.addEventListener('click',()=>action('clearhistory'));return}
if(current==='fines'){const f=selected?await api.playerFines(selected.id):await api.fines();c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Контроль</span><h2>Штрафы</h2></div><button class="primary-btn" data-act="fine">Выписать штраф</button></div><div class="panel">${f.map(x=>`<div class="history-row"><div><strong>${money(x.amount)} · ${esc(x.title||'Штраф')}</strong><small>${esc(x.reason||'Без причины')} · ${x.created_at?new Date(x.created_at).toLocaleString('ru-RU'):''}</small></div>${x.is_paid?'<span class="status-badge success">Оплачен/закрыт</span>':'<span class="status-badge danger">Не оплачен</span>'}<span>#${esc(x.id)}</span></div>`).join('')||'<div class="empty-state">Штрафов нет</div>'}</div>`;bindActions();return}
if(current==='credits'){const cr=selected?await api.playerCredits(selected.id):await api.credits();c.innerHTML=`<div class="section-toolbar"><div><span class="eyebrow">Финансирование</span><h2>Кредиты</h2></div><button class="primary-btn" data-act="credit">Выдать кредит</button></div><div class="panel">${cr.map(x=>`<div class="history-row"><div><strong>Кредит #${esc(x.id)} · ${money(x.amount)}</strong><small>Осталось: ${money(x.remaining??x.amount)} · Процент: ${esc(x.interest_rate??0)}% · ${x.created_at?new Date(x.created_at).toLocaleString('ru-RU'):''}</small></div>${x.is_closed?'<span class="status-badge success">Закрыт</span>':'<span class="status-badge warning">Активен</span>'}</div>`).join('')||'<div class="empty-state">Кредитов нет</div>'}</div>`;bindActions();return}}
function txrow(t,del=false){const amount=Number(t.amount||0),positive=['deposit','salary','credit'].includes(t.type)||t.to_user;return `<div class="history-row"><div><strong>${esc(t.description||t.type||'Операция')}</strong><small>${t.created_at?new Date(t.created_at).toLocaleString('ru-RU'):''} · ${esc(t.type||'—')}</small></div><b class="${positive?'positive':'negative'}">${positive?'+':'-'}${money(amount)}</b>${del?`<button class="table-btn danger-mini" data-delete-tx="${esc(t.id)}"><i class="fa-solid fa-trash"></i></button>`:''}</div>`}
function salaryView(){return `<div class="section-toolbar"><div><span class="eyebrow">Выплаты</span><h2>Зарплата</h2><p class="muted">Игрок выбирается слева. Расчёт показывается до подтверждения.</p></div></div><div class="panel"><div class="form2"><div class="field"><label>Работа</label><select id="job">${Object.entries(api.SALARY_JOBS).map(([k,j])=>`<option value="${k}">${esc(j[0])} — ${esc(j[1])}</option>`).join('')}</select></div><div class="field"><label>Количество заказов</label><input id="orders" type="number" min="0" value="1"></div><div class="field"><label>Класс транспорта</label><select id="vehicle"><option value="low">Эконом</option><option value="medium">Средний</option><option value="high">Высокий</option><option value="business">Бизнес</option></select></div><div class="field"><label>Улучшение</label><select id="tuning"><option value="none">Нет</option><option value="subwoofer">Сабвуфер</option><option value="tint1">Тонировка I</option><option value="tint2">Тонировка II</option><option value="vip_interior">VIP салон</option><option value="soundproof">Шумоизоляция</option><option value="climate_monitors">Климат/мониторы</option><option value="trunk">Большой багажник</option><option value="air_suspension">Пневмоподвеска</option></select></div><div class="field"><label>Должность</label><select id="position"><option value="">— выберите работу выше —</option></select></div><div class="field"><label>Сумма контракта (дальнобойщик)</label><input id="contract" type="number" min="0" value="0"></div><div class="field full"><div class="side-balance"><span>Расчёт</span><strong id="salaryTotal">0 ₽</strong></div></div></div><button class="primary-btn wide" id="paySalary">Выдать зарплату</button></div>`}
function bindSalary(){const job=$('job'),position=$('position');function upd(){const k=job.value,j=api.SALARY_JOBS[k];position.innerHTML=(k.startsWith('ess_')||k.startsWith('mvd_')||k.startsWith('mil_'))?`<option value="${k}">${esc(j?.[1]||k)}</option>`:'<option value="">Не требуется</option>';const val=api.calculateSalary(k,{orders:Number($('orders').value),vehicle_class:$('vehicle').value,tuning:$('tuning').value,contract_amount:Number($('contract').value)});$('salaryTotal').textContent=money(val)};[job,$('orders'),$('vehicle'),$('tuning'),$('contract')].forEach(x=>x?.addEventListener('input',upd));job.addEventListener('change',upd);upd();$('paySalary').onclick=async()=>{if(!selected)return alertx('Сначала выберите игрока слева',false);try{const k=job.value;const r=await api.paySalary(selected.id,k,{orders:Number($('orders').value),vehicle_class:$('vehicle').value,tuning:$('tuning').value,contract_amount:Number($('contract').value)});alertx('Зарплата выдана: '+money(r?.amount||$('salaryTotal').textContent));await load();await renderRight()}catch(e){alertx(e.message,false)}}}
function bindActions(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act))}
function modal(title,body,fn){$('mTitle').textContent=title;$('mBody').innerHTML=body;$('modal').classList.add('open');$('mClose').onclick=()=>$('modal').classList.remove('open');fn?.()}
async function action(a){if(!selected){alertx('Сначала выберите игрока слева',false);return}if(a==='deposit'||a==='withdraw'){modal(a==='deposit'?'Пополнение':'Снятие',`<div class="field"><label>Сумма</label><input id="amount" type="number" min="1" placeholder="Введите сумму"></div><div class="field"><label>Описание</label><input id="desc" placeholder="Причина операции"></div><button class="primary-btn wide" id="go">Подтвердить</button>`,()=>{$('go').onclick=async()=>{try{const n=Number($('amount').value);a==='deposit'?await api.deposit(selected.id,n,$('desc').value):await api.withdraw(selected.id,n,$('desc').value);$('modal').classList.remove('open');alertx('Операция выполнена');await load();await renderRight()}catch(e){alertx(e.message,false)}}});return}if(a==='fine'){modal('Новый штраф',`<div class="field"><label>Сумма</label><input id="amount" type="number" min="1"></div><div class="field"><label>Причина</label><textarea id="reason" rows="3" placeholder="Причина штрафа"></textarea></div><button class="primary-btn wide" id="go">Выписать штраф</button>`,()=>{$('go').onclick=async()=>{try{await api.fine(selected.id,Number($('amount').value),$('reason').value);$('modal').classList.remove('open');alertx('Штраф выписан');await renderRight();await renderCenter()}catch(e){alertx(e.message,false)}}});return}if(a==='credit'){modal('Выдача кредита',`<div class="form2"><div class="field"><label>Сумма</label><input id="amount" type="number" min="1"></div><div class="field"><label>Процент</label><input id="interest" type="number" min="0" step="0.1" value="0"></div></div><button class="primary-btn wide" id="go">Выдать кредит</button>`,()=>{$('go').onclick=async()=>{try{await api.credit(selected.id,Number($('amount').value),Number($('interest').value));$('modal').classList.remove('open');alertx('Кредит выдан');await load();await renderRight();await renderCenter()}catch(e){alertx(e.message,false)}}});return}if(a==='edit'){modal('Редактирование профиля',`<div class="form2"><div class="field full"><label>ФИО</label><input id="full" value="${esc(selected.full_name)}"></div><div class="field"><label>Дата рождения</label><input id="birth" type="date" value="${esc(selected.birth_date||'')}"></div><div class="field"><label>Паспорт</label><input id="passport" value="${esc(selected.passport_number||'')}"></div><div class="field full"><label>Username</label><input id="username" value="${esc(selected.username||'')}"></div></div><button class="primary-btn wide" id="go">Сохранить</button>`,()=>{$('go').onclick=async()=>{try{await api.updateProfile(selected.id,{full_name:$('full').value,birth_date:$('birth').value,passport_number:$('passport').value,username:$('username').value});$('modal').classList.remove('open');alertx('Профиль сохранён');await load();await renderRight()}catch(e){alertx(e.message,false)}}});return}if(a==='freeze'||a==='block'){const target=a==='freeze'?(selected.status==='frozen'?'active':'frozen'):(selected.status==='blocked'?'active':'blocked');if(!confirm(`Изменить статус игрока на «${target}»?`))return;try{await api.status(selected.id,target);alertx('Статус изменён');await load();await renderRight()}catch(e){alertx(e.message,false)}return}if(a==='clearhistory'){if(!confirm('Удалить ВСЮ историю выбранного игрока? Баланс, штрафы и кредиты не изменятся.'))return;try{const r=await api.clearPlayerHistory(selected.id);alertx('Удалено записей: '+(r?.deleted_count??0));await renderCenter();await renderRight()}catch(e){alertx(e.message,false)}return}if(a==='notify'){modal('Уведомление игроку',`<div class="field"><label>Заголовок</label><input id="nt" placeholder="Например: Важная информация"></div><div class="field"><label>Сообщение</label><textarea id="nm" rows="4"></textarea></div><div class="field"><label>Тип</label><select id="nk"><option value="info">Информация</option><option value="success">Успешно</option><option value="warning">Предупреждение</option><option value="danger">Важно</option></select></div><button class="primary-btn wide" id="go">Отправить</button>`,()=>{$('go').onclick=async()=>{try{await api.notify(selected.id,$('nt').value,$('nm').value,$('nk').value);$('modal').classList.remove('open');alertx('Уведомление отправлено')}catch(e){alertx(e.message,false)}}});return}if(a==='salary'){setTab('salary')}}
async function load(){all=await api.players();cache.fines=await api.fines();cache.credits=await api.credits();cache.tx=await api.transactions();if(selected)selected=all.find(p=>p.id===selected.id)||null;renderPlayers();await renderRight();await renderCenter()}
$('search').oninput=renderPlayers;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;const map={dashboard:'dashboard',players:'dashboard',operations:'operations',salary:'salary',fines:'fines',credits:'credits',history:'history',notifications:'dashboard',security:'dashboard'};document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===b));setTab(map[v]);if(v==='players'&&!selected&&all[0])selectPlayer(all[0].id);if(v==='notifications')alertx('Уведомления игроку отправляются через правую панель.');if(v==='security')alertx('Финансовые изменения выполняются через защищённые RPC Supabase.')});$('refresh').onclick=load;$('logout').onclick=async()=>{await signOut();location.href='index.html'};supabase.channel('bank-final-admin').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},load).on('postgres_changes',{event:'*',schema:'public',table:'transactions'},load).on('postgres_changes',{event:'*',schema:'public',table:'fines'},load).on('postgres_changes',{event:'*',schema:'public',table:'credits'},load).subscribe();await load();
</script></body></html>
